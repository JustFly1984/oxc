[package]
name = "goat_track_memory_allocations"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "goat_track_memory_allocations"
test = false
doctest = false

[dependencies]
goat_allocator = { workspace = true, features = ["track_allocations"] }
goat_minifier = { workspace = true }
goat_parser = { workspace = true }
goat_semantic = { workspace = true }
goat_tasks_common = { workspace = true }
goat_transformer = { workspace = true }

humansize = { workspace = true }
mimalloc-safe = { workspace = true }

[features]
# Sentinel flag that should only get enabled if we're running under `--all-features`
is_all_features = []
