[package]
name = "rulegen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rulegen"
test = true
doctest = false

[dependencies]
goat_allocator = { workspace = true }
goat_ast = { workspace = true }
goat_ast_visit = { workspace = true }
goat_parser = { workspace = true }
goat_span = { workspace = true }
goat_tasks_common = { workspace = true }

convert_case = { workspace = true }
handlebars = { workspace = true }
lazy-regex = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "printing"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }

[dev-dependencies]
insta = { workspace = true }


[package.metadata.cargo-shear]
ignored = ["proc-macro2"]
