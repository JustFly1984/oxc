[package]
name = "goat_ast_tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "goat_ast_tools"
test = true
doctest = false

[dependencies]
# These dependencies are only used by JS generators.
# So make them optional, and only enable them if `generate-js` feature is enabled.
# See comment on `js-generators` feature below.
#
# `features = ["serialize"]` on `goat_span` and `goat_syntax` is needed to work around a bug in `oxc_index`.
goat_allocator = { workspace = true, optional = true }
goat_ast = { workspace = true, optional = true }
goat_ast_visit = { workspace = true, optional = true }
goat_codegen = { workspace = true, optional = true, features = ["sourcemap"] }
goat_minifier = { workspace = true, optional = true }
goat_parser = { workspace = true, optional = true }
goat_span = { workspace = true, features = ["serialize"], optional = true }
goat_syntax = { workspace = true, features = ["serialize"], optional = true }

bitflags = { workspace = true }
bpaf = { workspace = true, features = ["autocomplete", "bright-color", "derive"] }
convert_case = { workspace = true }
cow-utils = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
javascript-globals = { workspace = true }
lazy-regex = { workspace = true }
oxc_index = { workspace = true }
phf = { workspace = true, features = ["macros"] }
phf_codegen = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true, features = ["extra-traits", "full", "parsing", "printing"] }
toml = { workspace = true }

[features]
default = ["generate-js"]
# Feature to enable JS generators that require `goat_*` crates.
# Enabled by default, but can be disabled to break the circular dependency
# when AST changes prevent local crates from compiling.
# See: https://github.com/goat-project/oxc/issues/15564
generate-js = [
  "dep:goat_allocator",
  "dep:goat_ast",
  "dep:goat_ast_visit",
  "dep:goat_codegen",
  "dep:goat_minifier",
  "dep:goat_parser",
  "dep:goat_span",
  "dep:goat_syntax",
]
