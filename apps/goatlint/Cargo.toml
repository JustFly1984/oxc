[package]
name = "goatlint"
version = "1.59.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "goatlint"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
goat_allocator = { workspace = true, features = ["fixed_size"] }
goat_ast = { workspace = true }
goat_ast_visit = { workspace = true, features = ["serialize"] }
goat_data_structures = { workspace = true, features = ["rope"] }
goat_diagnostics = { workspace = true }
goat_estree_tokens = { workspace = true }
goat_language_server = { workspace = true }
goat_linter = { workspace = true }
goat_napi = { workspace = true }
goat_parser = { workspace = true }
goat_semantic = { workspace = true }
goat_span = { workspace = true }

bpaf = { workspace = true, features = ["autocomplete", "bright-color", "derive"] }
cow-utils = { workspace = true }
ignore = { workspace = true, features = ["simd-accel"] }
miette = { workspace = true }
napi = { workspace = true, features = ["async"], optional = true }
tracing = { workspace = true }
napi-derive = { workspace = true, optional = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = [] } # Omit the `regex` feature
tower-lsp-server = { workspace = true, features = ["proposed"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_arch = "arm", target_arch = "riscv64", target_family = "wasm")))'.dependencies]
mimalloc-safe = { workspace = true, optional = true, features = ["skip_collect_on_exit"] }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm"), not(target_arch = "aarch64"), not(target_arch = "riscv64")))'.dependencies]
mimalloc-safe = { workspace = true, optional = true, features = [
  "skip_collect_on_exit",
  "local_dynamic_tls",
] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
mimalloc-safe = { workspace = true, optional = true, features = [
  "skip_collect_on_exit",
  "local_dynamic_tls",
  "no_opt_arch",
] }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
lazy-regex = { workspace = true }

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]
allocator = ["dep:mimalloc-safe"]
# For use in NAPI tests.
# - Enables test reporter.
# - Sorts file paths before linting if goatlint is run with `--threads 1`.
testing = ["goat_linter/force_test_reporter"]
