name: Miri

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "crates/goat_allocator/**"
      - "crates/goat_ast/src/utf8_to_utf16.rs"
      - "crates/goat_ast/src/generated/utf8_to_utf16_converter.rs"
      - "crates/goat_data_structures/**"
      - "crates/goat_parser/**"
      - "crates/goat_traverse/**"
      - ".github/workflows/miri.yml"
  push:
    branches:
      - main
    paths:
      - "crates/goat_allocator/**"
      - "crates/goat_ast/src/utf8_to_utf16.rs"
      - "crates/goat_ast/src/generated/utf8_to_utf16_converter.rs"
      - "crates/goat_data_structures/**"
      - "crates/goat_parser/**"
      - "crates/goat_traverse/**"
      - ".github/workflows/miri.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri
    runs-on: namespace-profile-linux-x64-default
    env:
      # FIXME: cargo-miri is broken on nightly-2026-02-12.
      # https://github.com/rust-lang/miri/issues/4855
      MIRI_TOOLCHAIN: nightly-2026-02-11
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/check-changes
        id: filter
        with:
          packages: goat_allocator,goat_ast,goat_data_structures,goat_parser,goat_transformer
          paths: .github/workflows/miri.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9 # v1.4.2
        with:
          path: /home/runner/.rustup
          cache: rust

      - name: Install Miri
        if: steps.filter.outputs.changed == 'true'
        run: |
          rustup toolchain install "${MIRI_TOOLCHAIN}" --component miri
          cargo +"${MIRI_TOOLCHAIN}" miri setup

      # `--lib --bins --tests` omits doctests, which Miri can't run
      # https://github.com/goat-project/oxc/pull/11092
      - name: Test with Miri
        if: steps.filter.outputs.changed == 'true'
        run: |
          cargo +"${MIRI_TOOLCHAIN}" miri test --lib --bins --tests --all-features -p goat_allocator -p goat_ast -p goat_data_structures
          cargo +"${MIRI_TOOLCHAIN}" miri test --lib --bins --tests -p goat_parser -p goat_transformer
