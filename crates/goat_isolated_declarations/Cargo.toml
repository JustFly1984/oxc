[package]
name = "goat_isolated_declarations"
version = "0.125.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/examples", "/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = false
test = false

[dependencies]
goat_allocator = { workspace = true }
goat_ast = { workspace = true }
goat_ast_visit = { workspace = true }
goat_diagnostics = { workspace = true }
goat_ecmascript = { workspace = true }
goat_span = { workspace = true }
goat_syntax = { workspace = true, features = ["to_js_string"] }

bitflags = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["glob"] }
goat_codegen = { workspace = true, features = ["sourcemap"] }
goat_parser = { workspace = true }
