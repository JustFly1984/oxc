[package]
name = "goat_span"
version = "0.124.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = true

[dependencies]
goat_allocator = { workspace = true }
goat_ast_macros = { workspace = true }
goat_estree = { workspace = true }
goat_str = { workspace = true }

compact_str = { workspace = true }
miette = { workspace = true }

schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
serialize = ["compact_str/serde", "dep:serde", "goat_estree/serialize", "goat_str/serialize"]
schemars = ["dep:schemars", "goat_str/schemars"]

[package.metadata.cargo-shear]
ignored = ["schemars"]
