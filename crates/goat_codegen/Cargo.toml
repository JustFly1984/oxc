[package]
name = "goat_codegen"
version = "0.125.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/examples", "/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = true

[dependencies]
goat_allocator = { workspace = true }
goat_ast = { workspace = true }
goat_data_structures = { workspace = true, features = ["code_buffer", "slice_iter", "stack"] }
oxc_index = { workspace = true }
goat_semantic = { workspace = true }
oxc_sourcemap = { workspace = true, optional = true }
goat_span = { workspace = true }
goat_syntax = { workspace = true }

bitflags = { workspace = true }
cow-utils = { workspace = true }
dragonbox_ecma = { workspace = true }
itoa = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
goat_parser = { workspace = true }
pico-args = { workspace = true }

[features]
default = ["sourcemap"]
sourcemap = ["dep:oxc_sourcemap"]
