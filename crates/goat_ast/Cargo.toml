[package]
name = "goat_ast"
version = "0.124.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
goat_allocator = { workspace = true }
goat_ast_macros = { workspace = true }
goat_data_structures = { workspace = true, features = ["inline_string"] }
goat_diagnostics = { workspace = true }
goat_estree = { workspace = true }
goat_regular_expression = { workspace = true }
goat_span = { workspace = true }
goat_syntax = { workspace = true }

bitflags = { workspace = true }

[features]
default = []
serialize = [
  "goat_allocator/serialize",
  "goat_span/serialize",
  "goat_syntax/serialize",
  "goat_estree/serialize",
]
