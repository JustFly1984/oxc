[package]
name = "goat_formatter"
version = "0.44.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/examples", "/src"]
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
goat_allocator = { workspace = true }
goat_ast = { workspace = true }
goat_data_structures = { workspace = true, features = ["stack", "code_buffer"] }
goat_jsdoc = { workspace = true }
goat_parser = { workspace = true }
goat_semantic = { workspace = true, optional = true }
goat_span = { workspace = true }
goat_syntax = { workspace = true }

cow-utils = { workspace = true }
fast-glob = { workspace = true }
markdown = { workspace = true }
natord = { workspace = true }
nodejs-built-in-modules = { workspace = true }
itoa = { workspace = true }
phf = { workspace = true, features = ["macros"] }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
goat_tasks_common = { workspace = true }
pico-args = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
goat_span = { workspace = true }

[features]
default = []
detect_code_removal = ["dep:goat_semantic"]

[lib]
doctest = false
