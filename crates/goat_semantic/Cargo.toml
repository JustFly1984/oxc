[package]
name = "goat_semantic"
version = "0.125.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/examples", "/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = true

[dependencies]
goat_allocator = { workspace = true }
goat_ast = { workspace = true }
goat_ast_visit = { workspace = true }
goat_cfg = { workspace = true, optional = true }
goat_diagnostics = { workspace = true }
goat_ecmascript = { workspace = true }
oxc_index = { workspace = true }
goat_jsdoc = { workspace = true, optional = true }
goat_span = { workspace = true }
goat_syntax = { workspace = true, features = ["to_js_string"] }

itertools = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
self_cell = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["glob"] }
goat_parser = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
cfg = ["dep:goat_cfg"]
jsdoc = ["dep:goat_jsdoc"]
linter = ["jsdoc"]
serialize = ["goat_span/serialize", "goat_syntax/serialize"]
