[package]
name = "goat_linter"
version = "1.59.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/examples", "/src"]
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[features]
default = []
ruledocs = ["goat_macros/ruledocs"] # Enables the `ruledocs` feature for conditional compilation
force_test_reporter = []

[lints]
workspace = true

[lib]
doctest = true

[dependencies]
goat_allocator = { workspace = true, features = ["fixed_size", "bitset"] }
goat_ast = { workspace = true }
goat_ast_macros = { workspace = true }
goat_ast_visit = { workspace = true, features = ["serialize"] }
goat_cfg = { workspace = true }
goat_codegen = { workspace = true, default-features = false }
goat_data_structures = { workspace = true, features = ["box_macros"] }
goat_diagnostics = { workspace = true }
goat_estree_tokens = { workspace = true }
goat_ecmascript = { workspace = true }
oxc_index = { workspace = true }
goat_macros = { workspace = true, features = ["ruledocs"] }
goat_parser = { workspace = true }
goat_regular_expression = { workspace = true }
oxc_resolver = { workspace = true }
goat_semantic = { workspace = true, features = ["cfg", "linter"] }
goat_span = { workspace = true, features = ["schemars", "serialize"] }
goat_syntax = { workspace = true, features = ["serialize"] }

#
bitflags = { workspace = true }
constcat = { workspace = true }
convert_case = { workspace = true }
cow-utils = { workspace = true }
fast-glob = { workspace = true }
icu_segmenter = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true, features = ["rayon"] }
itertools = { workspace = true }
javascript-globals = { workspace = true }
json-strip-comments = { workspace = true }
language-tags = { workspace = true }
lazy-regex = { workspace = true }
memchr = { workspace = true }
nodejs-built-in-modules = { workspace = true }
papaya = { workspace = true }
phf = { workspace = true, features = ["macros"] }
rayon = { workspace = true }
rust-lapper = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true, features = ["indexmap2", "regex"] }
self_cell = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [
  "preserve_order",
] } # preserve_order: print config with ordered keys.
simdutf8 = { workspace = true }
smallvec = { workspace = true }
spdx = { workspace = true }
url = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
markdown = { workspace = true }
